[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"

# Remappings
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Optimizer
optimizer = true
via_ir = true
optimizer_runs = 1

[profile.default.invariant]
runs = 8
depth = 8
fail_on_revert = false

# Explicit internal audit campaign; routine developer tests remain lightweight.
# Acceptance uses this profile and retains seeds and invariant-call statistics.
[profile.audit.fuzz]
runs = 10000

[profile.audit.invariant]
runs = 1000
depth = 100
fail_on_revert = true

[rpc_endpoints]
localhost = "http://localhost:8545"
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"
dogeos-chikyu = "${DOGEOS_CHIKYU_RPC_URL}"
